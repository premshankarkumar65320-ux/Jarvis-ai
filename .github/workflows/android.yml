name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check APK Permissions
        run: |
          echo "=== MERGED MANIFEST ==="
          grep -R -n "RECORD_AUDIO" android/app/build/intermediates 2>/dev/null || true
          echo "=== APK PERMISSIONS ==="
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "AAPT tool not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
